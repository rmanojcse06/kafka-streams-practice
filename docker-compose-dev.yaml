  kstream-prod-mongo:
    image: mongo:7.0
    container_name: kstream-prod-mongo-01
    ports:
      - "27017:27017"
    entrypoint: ["bash", "/usr/local/bin/mongo-replica-set-init.sh"]
    volumes:
      - ./mongodb-keyfile/mongo-keyfile:/etc/mongo-keyfile:ro
      - ./mongodb-init/mongo-replica-set-init.sh:/usr/local/bin/mongo-replica-set-init.sh:ro
      - ./dbstore/data:/data/db
    networks:
      - mongo-net

volumes:
  mongo_data:
    external: true

networks:
  mongo-net:
    driver: bridge